<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Jugados</title>
<link rel="icon" type="image/png" href="styles/ps-controller.jpg">
<link rel="stylesheet" href="styles/main.css" />
</head>
<body>
  <div id="loginScreen" style="display:none">
    <div class="login-box">
      <h2>Acceso</h2>
      <input id="pwd" type="password" placeholder="Contraseña" />
      <button id="loginBtn">Entrar</button>
      <div id="loginErr"></div>
    </div>
  </div>
  <header>
    <div class="wrap">
      <h1>📚 Jugados</h1>
      <div class="controls" aria-label="Controles de filtrado y ordenación">
        <label class="search">🔎 <input id="q" placeholder="Buscar por título…" autocomplete="off" /></label>
        <select id="yearSel"><option value="all">Todos los años</option></select>
        <select id="platformSel" multiple></select>
        <select id="sortSel">
          <option value="doc" selected>Orden: Documento</option>
          <option value="year-desc">Orden: Año ↓</option>
          <option value="year-asc">Orden: Año ↑</option>
          <option value="title-asc">Orden: Título A→Z</option>
          <option value="score-desc">Orden: Nota ↓</option>
          <option value="score-asc">Orden: Nota ↑</option>
        </select>
        <label style="display:flex; gap:8px; align-items:center">
          <span style="font-size:12px;color:#9fb0c3">Nota mínima</span>
          <input id="minScore" type="range" min="0" max="10" step="0.5" value="0" />
          <span id="minScoreVal" class="kbd">0</span>
        </label>
      </div>
      <div class="meta" id="meta"></div>
      <div class="chips" id="chips"></div>
    </div>
  </header>

  <main class="wrap" id="app"></main>

<script>
const API_BASE = localStorage.getItem('apiBase') || 'http://localhost:3000';
let GAMES = [];

const app = document.querySelector('#app');
const yearSel = document.querySelector('#yearSel');
const platformSel = document.querySelector('#platformSel');
const sortSel = document.querySelector('#sortSel');
const minScore = document.querySelector('#minScore');
const minScoreVal = document.querySelector('#minScoreVal');
const q = document.querySelector('#q');
const chips = document.querySelector('#chips');
const meta = document.querySelector('#meta');

const loginScreen = document.getElementById('loginScreen');
const loginBtn = document.getElementById('loginBtn');
const pwdInput = document.getElementById('pwd');
const loginErr = document.getElementById('loginErr');

function token() { return localStorage.getItem('accessToken'); }
function checkLogin() { loginScreen.style.display = token() ? 'none' : 'flex'; }

async function login() {
  loginErr.textContent = '';
  const res = await fetch(`${API_BASE}/auth/login`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username: 'admin', password: pwdInput.value })
  });
  if (!res.ok) { loginErr.textContent = 'Credenciales inválidas'; return; }
  const data = await res.json();
  localStorage.setItem('accessToken', data.accessToken);
  localStorage.setItem('refreshToken', data.refreshToken);
  checkLogin();
  await loadGames();
}

async function loadGames() {
  if (!token()) return;
  const res = await fetch(`${API_BASE}/games`, { headers: { Authorization: `Bearer ${token()}` } });
  if (!res.ok) {
    localStorage.removeItem('accessToken');
    checkLogin();
    return;
  }
  const data = await res.json();
  GAMES = data.items || [];
  buildFilters();
  render();
}

function buildFilters() {
  yearSel.innerHTML = '<option value="all">Todos los años</option>';
  platformSel.innerHTML = '';
  const years = [...new Set(GAMES.map(g => g.year))].sort((a,b)=>b-a);
  const platforms = [...new Set(GAMES.flatMap(g => g.platforms || []))].sort((a,b)=>a.localeCompare(b,'es'));
  years.forEach(y => { const o = document.createElement('option'); o.value = y; o.textContent = y; yearSel.appendChild(o); });
  platforms.forEach(p => { const o = document.createElement('option'); o.value = p; o.textContent = p; platformSel.appendChild(o); });
  chips.innerHTML = '';
  platforms.forEach(p => {
    const c = document.createElement('span'); c.className = 'chip'; c.textContent = p;
    c.onclick = () => { const o = [...platformSel.options].find(o=>o.value===p); o.selected = !o.selected; render(); };
    chips.appendChild(c);
  });
}

function card(g) {
  return `<div class="card"><div class="body"><div class="title">${g.title}</div><div class="sub">${g.year} · ${(g.platforms||[]).join(', ')} · ${String(g.score).replace('.',',')}</div></div></div>`;
}

function render() {
  const year = yearSel.value === 'all' ? null : Number(yearSel.value);
  const plats = [...platformSel.selectedOptions].map(o=>o.value);
  const term = q.value.trim().toLowerCase();
  const min = Number(minScore.value);
  const sort = sortSel.value;

  let list = GAMES.filter(g => (!year || g.year===year) && (!plats.length || (g.platforms||[]).some(p=>plats.includes(p))) && (!term || g.title.toLowerCase().includes(term)) && g.score>=min);
  if (sort==='doc') list.sort((a,b)=>a.idx-b.idx);
  if (sort==='year-desc') list.sort((a,b)=>b.year-a.year);
  if (sort==='year-asc') list.sort((a,b)=>a.year-b.year);
  if (sort==='title-asc') list.sort((a,b)=>a.title.localeCompare(b.title,'es'));
  if (sort==='score-desc') list.sort((a,b)=>b.score-a.score);
  if (sort==='score-asc') list.sort((a,b)=>a.score-b.score);

  meta.textContent = `Mostrando ${list.length} de ${GAMES.length} juegos`;
  app.innerHTML = list.length ? `<div class="grid">${list.map(card).join('')}</div>` : '<div class="empty">No hay resultados</div>';
  minScoreVal.textContent = minScore.value.replace('.', ',');
}

loginBtn.onclick = login;
pwdInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') login(); });
[minScore, q, yearSel, platformSel, sortSel].forEach(el => el.addEventListener('input', render));

checkLogin();
loadGames();
</script>
</body>
</html>
